openapi: 3.0.0
paths:
  /health:
    get:
      description: >-
        Liefert Version, die aktuelle Belegung der flüchtigen Ablage und eine
        Bilanz der

        Einlieferungen.


        `open.traffic` beantwortet die Frage, ob eine Grenze gegriffen hat:
        `accepted` sind die

        angenommenen Einlieferungen, `rejected` zählt die abgewiesenen **je
        Grund**. Die Zähler

        liegen im Arbeitsspeicher und beginnen bei jedem Neustart neu — `since`
        sagt, ab wann.


        Gezählt werden nur Summen. Kein Benutzername, keine Adresse, kein
        Zeitstempel je

        Vorgang: Diese Auskunft soll diagnostisch nutzbar sein, ohne ein
        Zugriffsprotokoll zu

        werden.
      operationId: HealthController_health
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      summary: Läuft der Dienst?
      tags:
        - betrieb
  /open/messages:
    post:
      description: >-
        Legt eine Nutzlast in der Warteschlange des angegebenen Benutzernamens
        ab.


        Der Empfänger muss nicht existieren und sich nirgends registrieren — der

        Benutzername ist einfach ein Fach, das beim ersten Einliefern entsteht.


        **`from` ist hier eine unbeglaubigte Behauptung.** Jeder kann jeden
        Absender angeben.


        **Grenzen dieses Pfades:** Nutzlast höchstens 64 KB, höchstens 20
        Nachrichten je

        Benutzername, höchstens 500 belegte Benutzernamen, 64 MB über alles,
        höchstens 60

        Einlieferungen je Aufrufer und Minute. Jede Nachricht verfällt nach 60
        Minuten.


        HINWEIS: Nur synthetische Testdaten einliefern. Keine personenbezogenen
        Daten, keine Kundendaten, keine Zugangsdaten, keine Echtdaten aus
        Produktivsystemen — auch nicht zum Ausprobieren. Dieser Dienst läuft auf
        einer Demo-Box bei einem externen Anbieter in einer öffentlichen Cloud.
      operationId: OpenMessagesController_submit
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitMessageDto'
      responses:
        '201':
          description: Angenommen. Die Kennung wird zum Entnehmen gebraucht.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionAcceptedDto'
        '400':
          description: Eingabe verletzt das Schema.
        '413':
          description: Die Nutzlast überschreitet die Größengrenze von 64 KB.
        '429':
          description: >-
            Entweder liegen für diesen Benutzernamen bereits 20 Nachrichten
            bereit, oder der Aufrufer hat die 60 Einlieferungen pro Minute
            ausgeschöpft.
        '503':
          description: >-
            Der Dienst ist ausgelastet: Gesamtspeicher erschöpft oder zu viele
            belegte Benutzernamen. Später erneut versuchen (siehe Retry-After).
      summary: Nachricht einliefern
      tags:
        - offen
    get:
      description: >-
        Liefert alle bereitliegenden Nachrichten des angefragten Benutzernamens,
        älteste zuerst.


        **Dieser Aufruf verändert nichts** und ist beliebig wiederholbar.
        Entnommen wird mit

        `DELETE /open/messages/{id}` — ein eigener Aufruf.


        Die Trennung ist Absicht: ein `GET` ist in HTTP zustandsfrei, Clients
        wiederholen es

        nach einem Timeout, und Crawler wie Link-Vorschauen rufen öffentliche
        URLs

        unaufgefordert auf. Würde das Ansehen entnehmen, verschwänden
        Nachrichten, bevor der

        Empfänger sie sieht.


        **Leer ist kein Fehler:** liegt nichts bereit, kommt `204` ohne Rumpf —
        nicht `404`.
      operationId: OpenMessagesController_peek
      parameters:
        - name: to
          required: true
          in: query
          description: Benutzername, dessen Warteschlange angesehen werden soll.
          schema:
            minLength: 1
            maxLength: 32
            pattern: ^[A-Za-z0-9_-]{1,32}$
            example: anna
            type: string
      responses:
        '200':
          description: Es liegen Nachrichten bereit.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageDto'
        '204':
          description: Es liegt nichts bereit. Das ist der Normalfall, kein Fehler.
        '400':
          description: Der Benutzername fehlt oder verletzt das Muster.
      summary: Nachrichten ansehen (ohne zu entnehmen)
      tags:
        - offen
  /open/messages/{id}:
    delete:
      description: >-
        Entnimmt genau die Nachricht mit dieser Kennung. Sie ist danach fort und
        wird kein

        zweites Mal ausgeliefert.


        Die Kennung stammt aus `GET /open/messages?to=...` oder aus der Quittung
        der

        Einlieferung.


        **Kein Nachweis nötig** — jeder, der die Kennung kennt, kann entnehmen.
        Das ist die

        Eigenschaft des offenen Pfades.
      operationId: OpenMessagesController_remove
      parameters:
        - name: id
          required: true
          in: path
          description: Kennung der Nachricht.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Entnommen.
        '404':
          description: >-
            Diese Kennung gibt es nicht (mehr) — bereits entnommen oder
            verfallen.
      summary: Nachricht entnehmen
      tags:
        - offen
  /open/names:
    get:
      description: >-
        Listet jeden Benutzernamen, der derzeit im Arbeitsspeicher vorkommt —
        als Empfaenger,

        als behaupteter Absender oder beides — mit der Anzahl der jeweils noch
        liegenden

        Nachrichten.


        **Das ist kein Verzeichnis von Konten.** Auf diesem Pfad gibt es keine
        Registrierung:

        Ein Name entsteht beim ersten Einliefern und verschwindet wieder, sobald
        seine letzte

        Nachricht entnommen ist oder verfallen ist. Wer hier fehlt, kann
        trotzdem beliefert

        werden.


        **Absender sind Behauptungen.** `waitingAsSender` zaehlt, was in den
        Nachrichten steht,

        nicht wer sie geschickt hat. Auf dieser Stufe prueft das niemand.


        **Diese Liste ist oeffentlich, und das ist der Punkt.** Sie zeigt, dass
        ein Name auf

        dem offenen Pfad nichts verbirgt: Jeder kann jede Warteschlange ansehen
        und entnehmen.

        Vertraulichkeit entsteht hier ausschliesslich daraus, dass die Nutzlast
        bereits

        verschluesselt eingeliefert wird.


        **Genau deshalb gilt die Compliance-Auflage auch fuer Namen:** Ein
        echter Vor- oder

        Nachname im Feld `to` oder `from` steht ueber diese Operation im
        Internet. Nur

        synthetische Bezeichner verwenden.


        Der Aufruf hat keine Nebenwirkung und ist beliebig wiederholbar.
      operationId: OpenNamesController_list
      parameters: []
      responses:
        '200':
          description: >-
            Die derzeit belegten Namen, alphabetisch. Leerer Speicher ergibt
            eine leere Liste.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NameUsageDto'
      summary: Benutzte Namen auflisten
      tags:
        - offen
  /oidc/config:
    get:
      description: >-
        Nennt Identitaetsanbieter und Client-Kennung, mit denen ein
        Zugriffstoken fuer die

        OIDC-Stufe geholt wird. **Diese Operation braucht selbst keinen
        Nachweis** — wer sich

        anmelden will, hat noch keinen.


        Unter `discoveryUrl` liegt das Metadaten-Dokument des Anbieters; darin
        stehen die

        Adressen fuer Anmeldung und Tokenausgabe. Der vorgesehene Fluss ist
        **Authorization

        Code mit PKCE**; der Client ist oeffentlich und hat kein Geheimnis.


        Ist die Stufe auf dieser Instanz nicht eingerichtet, ist `configured`
        falsch und die

        uebrigen Felder sind leer.
      operationId: OidcConfigController_read
      parameters: []
      responses:
        '200':
          description: Die Eckdaten. Bei nicht eingerichteter Stufe leer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfigDto'
      summary: Eckdaten fuer die Anmeldung
      tags:
        - oidc
  /oidc/whoami:
    get:
      description: >-
        Gibt zurueck, als wer der Dienst den Aufrufer erkannt hat.


        Auf dieser Stufe ist der Absender **kein Feld im Anfragekoerper**,
        sondern wird aus dem

        Zugriffstoken abgeleitet. Dieser Endpunkt zeigt das Ergebnis dieser
        Ableitung — er ist

        der schnellste Weg zu pruefen, ob ein Token angenommen wird, bevor damit
        etwas

        eingeliefert wird.
      operationId: DirectoryController_whoami
      parameters: []
      responses:
        '200':
          description: Der Aufrufer, wie er aus dem Nachweis hervorgeht.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoamiDto'
        '401':
          description: >-
            Kein, abgelaufenes oder nicht fuer diesen Dienst ausgestelltes
            Zugriffstoken.
        '503':
          description: Die OIDC-Stufe ist auf dieser Instanz nicht konfiguriert.
      security:
        - oidc: []
      summary: Den eigenen Nachweis pruefen
      tags:
        - oidc
  /oidc/directory:
    get:
      description: >-
        Listet die Konten, an die auf dieser Stufe eingeliefert werden kann.


        Anders als auf dem offenen Pfad ist ein Empfaenger hier kein frei
        erfundener Name,

        sondern ein vorhandenes Konto. Der Wert aus `username` ist es, der beim
        Einliefern

        in das Feld `to` gehoert.


        **Diese Antwort enthaelt personenbezogene Daten** (Anzeigenamen). Sie
        ist nur mit

        gueltigem Nachweis abrufbar und darf nicht weiterveroeffentlicht werden.


        **Zur Aussagekraft der Anmeldung auf dieser Instanz:** Die Konten sind
        mit einem fuer

        alle gleichen, dauerhaften Kennwort eingerichtet. Wer das Kennwort
        kennt, kann sich

        als jedes Konto anmelden. Der Benutzername in einem Token weist daher
        **im Kursbetrieb

        keine Person nach** — er ist eine Zuordnung, kein Identitaetsnachweis.
      operationId: DirectoryController_list
      parameters: []
      responses:
        '200':
          description: Die Konten des Realms, nach Benutzername sortiert.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryEntryDto'
        '401':
          description: >-
            Kein, abgelaufenes oder nicht fuer diesen Dienst ausgestelltes
            Zugriffstoken.
        '503':
          description: >-
            Die OIDC-Stufe oder das Dienstkonto ist nicht konfiguriert, oder der
            Identitaetsanbieter antwortet nicht.
      security:
        - oidc: []
      summary: Benutzerverzeichnis abrufen
      tags:
        - oidc
info:
  title: UTZ MessageHub
  description: >-
    Ein kleiner Vermittlungsdienst: eine Nutzlast zu einem Benutzernamen
    einliefern und

    unter demselben Namen wieder abholen. Store-and-forward, mehr nicht — kein
    Chat, keine

    Historie, keine Zustellbestätigung.


    Die Ablage ist eine **Warteschlange je Benutzername**. Ansehen lässt sie
    unverändert

    und ist wiederholbar; Entnehmen ist ein eigener Aufruf, und jede Nachricht
    wird genau

    einmal entnommen.


    Die Nutzlast ist für den Dienst **opak**: er interpretiert sie nicht und
    erwartet keine

    Struktur. Wer sie verschlüsselt einliefert, bekommt sie verschlüsselt
    zurück.


    ## Datenschutz und Compliance


    Nur synthetische Testdaten einliefern. Keine personenbezogenen Daten, keine
    Kundendaten, keine Zugangsdaten, keine Echtdaten aus Produktivsystemen —
    auch nicht zum Ausprobieren. Dieser Dienst läuft auf einer Demo-Box bei
    einem externen Anbieter in einer öffentlichen Cloud.


    Submit synthetic test data only. No personal data, no customer data, no
    credentials, no production data. This service runs on a throwaway demo box
    hosted by an external cloud provider.


    ## Aufrufe aus dem Browser


    Aufrufe aus beliebigen Origins sind zugelassen
    (`Access-Control-Allow-Origin: *`).

    Es werden **keine** Credentials benötigt: kein Cookie, keine
    HTTP-Authentifizierung.

    Setze im Client **nicht** `credentials: "include"` — damit verlangt der
    Browser einen

    konkreten Origin statt der Wildcard, und der Aufruf scheitert, obwohl der
    Code korrekt

    aussieht.


    ## Schutzstufen


    Jeder UTZ-Dienst wird in drei Stufen nebeneinander angeboten, mit
    **getrennten

    Endpunkten und getrennten Ablagen**. Es gibt keinen Uebergang zwischen
    ihnen: was

    unter einer Stufe eingeliefert wurde, ist über die anderen nicht erreichbar.


    | Stufe | Pfad | Nachweis | Was der Dienst weiss | Ablage |

    |---|---|---|---|---|

    | offen | `/open/...` | keiner | nichts | flüchtig, im Arbeitsspeicher, mit
    Grenzen und Verfall |

    | Token | `/token/...` | API-Token | dass der Aufrufer dazugehört, nicht wer
    er ist | dauerhaft (noch nicht gebaut) |

    | OIDC | `/oidc/...` | OIDC-Zugriffstoken | wer der Aufrufer ist | dauerhaft
    (noch nicht gebaut) |


    In Betrieb sind der **offene Pfad** vollständig und von der **OIDC-Stufe**
    die

    Identität (`/oidc/whoami`) und das Benutzerverzeichnis (`/oidc/directory`).
    Die

    Nachrichten-Endpunkte der geschützten Stufen gibt es noch nicht.


    ### Der Absender je Stufe


    Auf dem offenen Pfad und auf der Token-Stufe ist `from` eine **unbeglaubigte

    Behauptung** — jeder kann jeden Absender angeben. Erst auf der OIDC-Stufe
    wird der

    Absender **aus dem Nachweis abgeleitet** und ist dort kein Feld des
    Anfragekörpers

    mehr; ein mitgeschicktes `from` wird abgewiesen.
  version: 0.1.16+6afc10e
  contact: {}
tags: []
servers:
  - url: https://utz-messagehub.itzcloud.de
components:
  securitySchemes:
    kurs-token:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Das gemeinsame Kurs-Token der Token-Stufe. Es weist Zugehoerigkeit nach,
        keine Identitaet — der Dienst weiss damit nicht, wer aufruft.
    oidc:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: >-
        Persoenliches Zugriffstoken aus dem Anmeldevorgang beim
        Identitaetsanbieter (Authorization Code mit PKCE). Der Dienst prueft es
        gegen den oeffentlichen Schluesselsatz und leitet daraus den Absender
        ab.
  schemas:
    MessageDto:
      type: object
      properties:
        id:
          type: string
          description: >-
            Kennung dieser Nachricht. Wird zum Entnehmen gebraucht (DELETE) und
            ist im Kurs diagnostisch: "welche hast du abgeholt".
          example: 3f2a1c9e-7b4d-4a11-9c3e-2d5f8a0b1c22
          format: uuid
        to:
          type: string
          description: Benutzername des Empfängers.
          example: anna
        from:
          type: string
          description: Behaupteter Absender. Auf dem offenen Pfad unbeglaubigt.
          example: bert
        message:
          type: string
          description: Die opake Nutzlast, unverändert so, wie sie eingeliefert wurde.
          example: U2FsdGVkX1+aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789==
        receivedAt:
          type: string
          description: Zeitpunkt der Einlieferung (ISO 8601, UTC).
          example: '2026-09-01T10:15:30.000Z'
          format: date-time
        expiresAt:
          type: string
          description: >-
            Zeitpunkt, ab dem die Nachricht verfallen ist und nicht mehr
            ausgeliefert wird (ISO 8601, UTC).
          example: '2026-09-01T11:15:30.000Z'
          format: date-time
      required:
        - id
        - to
        - from
        - message
        - receivedAt
        - expiresAt
    SubmissionAcceptedDto:
      type: object
      properties:
        id:
          type: string
          description: Kennung der eingelieferten Nachricht.
          example: 3f2a1c9e-7b4d-4a11-9c3e-2d5f8a0b1c22
          format: uuid
        expiresAt:
          type: string
          description: Zeitpunkt, ab dem sie verfallen ist (ISO 8601, UTC).
          example: '2026-09-01T11:15:30.000Z'
          format: date-time
      required:
        - id
        - expiresAt
    SubmitMessageDto:
      type: object
      properties:
        to:
          type: string
          minLength: 1
          maxLength: 32
          description: >-
            Benutzername des Empfängers. Frei wählbar, keine Registrierung
            nötig. Groß- und Kleinschreibung werden unterschieden.
          example: anna
          pattern: ^[A-Za-z0-9_-]{1,32}$
        from:
          type: string
          minLength: 1
          maxLength: 32
          description: >-
            Benutzername des Absenders. ACHTUNG: Auf dem offenen Pfad ist dies
            eine unbeglaubigte Behauptung — jeder kann hier jeden Namen
            eintragen. Der Dienst prüft nichts. Erst auf der OIDC-Stufe wird der
            Absender aus dem Nachweis abgeleitet.
          example: bert
          pattern: ^[A-Za-z0-9_-]{1,32}$
        message:
          type: string
          minLength: 1
          description: >-
            Die Nutzlast. Für den Dienst eine opake Zeichenkette: sie wird weder
            interpretiert noch auf eine Struktur geprüft. Typischerweise ein
            Chiffrat in Base64. Größengrenze siehe Beschreibung der Operation.
          example: U2FsdGVkX1+aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789==
      required:
        - to
        - from
        - message
    NameUsageDto:
      type: object
      properties:
        name:
          type: string
          description: >-
            Der Benutzername, so wie er eingeliefert wurde — Gross- und
            Kleinschreibung inbegriffen.
          example: anna
        waitingAsRecipient:
          type: number
          description: Wie viele Nachrichten fuer diesen Namen derzeit bereitliegen.
          example: 2
        waitingAsSender:
          type: number
          description: >-
            Wie viele der noch liegenden Nachrichten diesen Namen als Absender
            **behaupten**. Auf diesem Pfad ist das kein Nachweis.
          example: 1
      required:
        - name
        - waitingAsRecipient
        - waitingAsSender
    OidcConfigDto:
      type: object
      properties:
        configured:
          type: boolean
          description: >-
            Ist die OIDC-Stufe auf dieser Instanz eingerichtet? Wenn nicht,
            antworten die uebrigen Endpunkte unter /oidc mit 503.
          example: true
        issuer:
          type: string
          description: Der Identitaetsanbieter, gegen den angemeldet wird.
          example: https://auth.example.test/realms/utz
        clientId:
          type: string
          description: >-
            Kennung des oeffentlichen Clients. Kein Geheimnis — sie steht im
            Anmelde-Link.
          example: utz-messagehub
        discoveryUrl:
          type: string
          description: >-
            Metadaten-Dokument des Anbieters. Darin stehen die Adressen fuer
            Anmeldung und Tokenausgabe.
          example: >-
            https://auth.example.test/realms/utz/.well-known/openid-configuration
      required:
        - configured
        - issuer
        - clientId
        - discoveryUrl
    WhoamiDto:
      type: object
      properties:
        username:
          type: string
          description: >-
            Der Benutzername aus dem Token. Auf dieser Stufe ist das der
            Absender jeder eingelieferten Nachricht — er kann nicht im
            Anfragekoerper gesetzt werden.
          example: mmustermann
        subject:
          type: string
          description: >-
            Unveraenderliche Kennung des Kontos beim Identitaetsanbieter
            (`sub`).
          example: 5f1c9e2a-1c3e-4a1b-9f0e-2b7d8c4a6e10
      required:
        - username
        - subject
    DirectoryEntryDto:
      type: object
      properties:
        username:
          type: string
          description: >-
            Die Benutzerkennung. Genau dieser Wert gehoert in das Feld `to`,
            wenn an diese Person eingeliefert wird.
          example: mmustermann
        displayName:
          type: string
          description: >-
            Anzeigename des Kontos, wie er im Identitaetsanbieter hinterlegt
            ist. Nur zur Anzeige — adressiert wird ueber `username`.
          example: Maxi Mustermensch
      required:
        - username
        - displayName
